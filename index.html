
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172554">

    <title>WiFi Bliss | Welcome</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="brand">
            <span class="brand-icon">⌁</span>
            <span>WiFi<span class="brand-accent">Bliss</span></span>
        </a>

        <a href="pages/login.html" class="login-link">Log In</a>
    </header>

    <main>
        <section class="hero">

            <div class="glow glow-one"></div>
            <div class="glow glow-two"></div>
            <div class="particles" aria-hidden="true"></div>

            <div class="hero-content">

                <p class="eyebrow">
                    YOUR WORLD. YOUR CONNECTION.
                </p>

                <div class="wifi-orb" aria-label="Wi-Fi symbol">
                    <svg class="wifi-symbol"
                         viewBox="0 0 100 100"
                         role="img"
                         aria-hidden="true">

                        <path d="M12 36 Q50 2 88 36"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="7"
                              stroke-linecap="round"/>

                        <path d="M25 50 Q50 28 75 50"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="7"
                              stroke-linecap="round"/>

                        <path d="M38 64 Q50 53 62 64"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="7"
                              stroke-linecap="round"/>

                        <circle cx="50" cy="78" r="5"
                                fill="currentColor"/>
                    </svg>
                </div>

                <h1>
                    Welcome to a
                    <span class="gradient-text">Better Connection.</span>
                </h1>

                <p class="hero-description">
                    Discover flexible Wi-Fi packages, easy payments
                    and a connection that keeps you close to what matters.
                </p>

                <div class="hero-buttons">
                    <a href="pages/packages.html" class="btn btn-primary">
                        Explore Packages <span>→</span>
                    </a>

                    <a href="pages/voucher.html" class="btn btn-secondary">
                        Redeem Voucher
                    </a>
                </div>

                <p class="hero-note">
                    <span class="status-dot"></span>
                    Your connection, your way.
                </p>

            </div>

            <div class="scroll-hint" aria-hidden="true">
                <span></span>
            </div>

        </section>
    </main>

    <footer class="site-footer">
        <p>Made for better connections <span>♥</span></p>
    </footer>

</body>
</html>
